name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: 课程校验（CPython，.python-version）
        run: uv run --locked python tests/check_course.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装站点依赖
        working-directory: site
        run: npm ci

      - name: Pyodide 校验
        working-directory: site
        run: npm run verify:pyodide

      - name: 构建站点
        working-directory: site
        run: npm run build

      - name: 冒烟测试（系统 Chrome）
        working-directory: site
        run: |
          node scripts/serve.mjs --port 5180 &
          for i in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:5180/ && break; sleep 0.5; done
          npm run smoke
