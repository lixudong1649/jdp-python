[project]
name = "jdp-python"
version = "0.1.0"
description = "Python 学习与实验仓（示例、学习文档）"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
data = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
web = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["examples/项目", "tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tests/fixtures/explain/020-syntax-error"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E402", "E741"]
"tests/check_course.py" = ["E501"]
"tests/check_explain.py" = ["E501"]
"site/public/py-explain.py" = ["E501"]
"tests/fixtures/explain/**" = ["E731", "E722", "F632", "F821", "E711", "F601", "I001"]
"examples/项目/13-计时重试装饰器/timing.py" = ["UP047"]
